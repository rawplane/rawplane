baseURL: "https://examplesite.com/"
title: Rasya
paginate: 5
theme: PaperMod
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
googleAnalytics: UA-123-45

minify:
  disableXML: true
minifyOutput: true

params:
  env: production
  title: Rasya
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    #disableHLJS: true
    #disableFingerprinting: true
  favicon: "img/favicon.ico"
  favicon16x16: "<link / abs url>"
  favicon32x32: "<link / abs url>"
  apple_touch_icon: "<link / abs url>"
  safari_pinned_tab: "<link / abs url>"
  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  profileMode:
    enabled: false
    title: Rasya
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Halo \U0001F44B"
    Content: Nama saya Rasya, dan selamat datang di blog saya.
  socialIcons:
    - name: github
      url: "https://github.com/diurnalcoders/"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/21842955/rasya"
    - name: hackthebox
      url: "https://app.hackthebox.com/home"
    - name: medium
      url: "https://medium.com/@rasyaadrian1234/about"
    
  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true
    
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]
outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: archive
      name: Arsip
      url: /archives
      weight: 10
    - identifier: about
      name: Tentang
      url: /about
      weight: 20
    - identifier: search
      name: Search
      url: /search
      weight: 30

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false